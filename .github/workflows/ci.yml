name: Go CI

on:
  push:
    branches: [ main, feature ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...
        

      - name: Build Docker image
        run: docker build -t myblocknot .

